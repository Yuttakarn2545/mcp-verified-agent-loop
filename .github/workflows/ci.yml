name: Verify MCP Agent Showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Run verified agent demo
        run: npm run demo -- --approve
